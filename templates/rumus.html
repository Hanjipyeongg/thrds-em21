<!doctype html>
<html lang="id"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head>
<body><div class="page uc">
<div class="bar"><div class="label"><div class="dot"></div>{{Label}}</div><div class="handle">@emmawt21</div></div>
<div class="title"><div class="sorotan">{{Sorotan}}</div><div>{{Judul}}</div></div>
<p class="sub">{{Subjudul}}</p>
<div class="formula"><div class="cap">RUMUS</div><code>{{Rumus}}</code></div>
<div class="row2 r-rumus">
<div class="sheet c2">
<div class="cl"></div><div class="cl">A</div><div class="cl end">B</div>
<div class="rn">1</div><div class="hd">{{Label kiri}}</div><div class="hd end">{{Label kanan}}</div>
<div class="rn">2</div><div>{{Kiri 1}}</div><div class="end">{{Kanan 1}}</div>
<div class="rn">3</div><div>{{Kiri 2}}</div><div class="end">{{Kanan 2}}</div>
<div class="rn">4</div><div>{{Kiri 3}}</div><div class="end">{{Kanan 3}}</div>
<div class="rn last">5</div><div class="last">{{Kiri 4}}</div><div class="last end">{{Kanan 4}}</div>
</div>
<div class="result"><div class="cap">HASIL</div><div class="val">{{Hasil}}</div></div>
</div>
%IF Tips%<div class="tips"><b>Tips:</b> {{Tips}}</div>%END%
<div class="bar foot"><div>Simpan biar gak lupa</div>%BOOKMARK%</div>
</div></body></html>
