<!doctype html>
<html lang="id"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"></head>
<body><div class="page">
<div class="bar"><div class="label"><div class="dot"></div>{{Label}}</div><div class="handle">@emmawt21</div></div>
<div class="title"><div class="sorotan">{{Sorotan}}</div><div>{{Judul}}</div></div>
<p class="sub">{{Subjudul}}</p>
<div class="cmp">
<div class="col weak">
<div class="tag">%CROSS%{{Label kiri}}</div>
<div class="cell">{{Kiri 1}}</div>
<div class="cell">{{Kiri 2}}</div>
<div class="cell">{{Kiri 3}}</div>
<div class="cell">{{Kiri 4}}</div>
</div>
<div class="col strong">
<div class="tag">%CHECK_SM%{{Label kanan}}</div>
<div class="cell">{{Kanan 1}}</div>
<div class="cell">{{Kanan 2}}</div>
<div class="cell">{{Kanan 3}}</div>
<div class="cell">{{Kanan 4}}</div>
</div>
</div>
<div class="bar foot"><div>Simpan biar gak lupa</div>%BOOKMARK%</div>
</div></body></html>
